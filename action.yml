name: 5-Minute Security Checker
description: Scan a repository for likely credentials and emit SARIF
inputs:
  path:
    description: Directory to scan
    required: false
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - shell: bash
      run: |
        cd "${{ github.action_path }}"
        corepack enable
        pnpm install
        pnpm build
        node dist/cli.js "${{ inputs.path }}" --sarif "$RUNNER_TEMP/security-checker.sarif"
    - uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: ${{ runner.temp }}/security-checker.sarif
